<!doctype html>
<html lang="pt-BR" class="dark" style="background-color: #090d16; color: #f1f5f9;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>PlayTelas — CineLive TV PWA</title>
    <meta name="description" content="Aplicativo PWA de TV ao vivo com 165 canais em alta definição, guia EPG completo em tempo real, controle remoto virtual inteligente, busca por voz, transmissão Smart TV e controle parental." />
    <meta property="og:title" content="PlayTelas — CineLive TV PWA" />
    <meta property="og:description" content="Aplicativo PWA de TV ao vivo com 165 canais em alta definição, guia EPG completo em tempo real, controle remoto virtual inteligente, busca por voz, transmissão Smart TV e controle parental." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#090d16" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="PlayTelas" />

    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="./pwa-192x192.png" />

    <!-- Google Fonts for crisp typography: Inter and JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  </head>
  <body class="bg-[#090d16] text-slate-100 antialiased overflow-x-hidden selection:bg-indigo-500 selection:text-white" style="background-color: #090d16; color: #f1f5f9; margin: 0; min-height: 100vh;">
    <noscript>
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #090d16; color: #fff; font-family: sans-serif; text-align: center; padding: 20px;">
        <div>
          <h2>JavaScript Necessário</h2>
          <p style="color: #94a3b8;">Por favor, habilite o JavaScript em seu navegador para utilizar o PlayTelas.</p>
        </div>
      </div>
    </noscript>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090d16; color: #fff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; padding: 24px; text-align: center;">
        <div style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #6366f1, #ec4899); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); margin-bottom: 16px;">
          <svg style="width: 28px; height: 28px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
        </div>
        <div style="font-weight: 800; font-size: 1.25rem; letter-spacing: -0.025em; color: #f8fafc; margin-bottom: 6px;">PlayTelas • CineLive TV</div>
        <div id="splash-status" style="font-size: 0.85rem; color: #94a3b8; max-width: 380px;">Iniciando transmissão e catálogo de canais...</div>
        <div id="splash-fallback" style="display: none; margin-top: 20px; max-width: 420px; background: rgba(30, 41, 59, 0.85); border: 1px solid rgba(51, 65, 85, 0.9); padding: 16px; border-radius: 16px; font-size: 0.8rem; color: #cbd5e1; line-height: 1.5;">
          <p id="splash-fallback-title" style="margin: 0 0 8px 0; font-weight: 600; color: #facc15;">O aplicativo está demorando para iniciar</p>
          <p id="splash-fallback-detail" style="margin: 0 0 12px 0; font-size: 0.75rem; color: #94a3b8;">
            Se uma versão anterior ficou salva no cache do navegador, limpe o cache abaixo para carregar a versão atualizada.
          </p>
          <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;">
            <button onclick="window.__playtelasResetCache()" style="background: #4f46e5; color: white; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 0.8rem; cursor: pointer;">
              Limpar Cache e Recarregar
            </button>
            <button onclick="window.location.reload()" style="background: #334155; color: #e2e8f0; border: none; padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 0.8rem; cursor: pointer;">
              Tentar Novamente
            </button>
          </div>
        </div>
      </div>
    </div>
    <script>
      window.__playtelasResetCache = function () {
        var finish = function () {
          window.location.reload();
        };
        try {
          var ops = [];
          if ('serviceWorker' in navigator) {
            ops.push(
              navigator.serviceWorker.getRegistrations().then(function (regs) {
                return Promise.all(regs.map(function (r) { return r.unregister(); }));
              })
            );
          }
          if ('caches' in window) {
            ops.push(
              caches.keys().then(function (keys) {
                return Promise.all(keys.map(function (k) { return caches.delete(k); }));
              })
            );
          }
          Promise.all(ops).then(finish, finish);
        } catch (e) {
          finish();
        }
      };

      (function () {
        var isUncompiledSource = function () {
          return !!document.querySelector('script[type="module"][src*="src/main.tsx"]');
        };

        var tryRedirectToDocs = function (onUnavailable) {
          if (!isUncompiledSource()) {
            onUnavailable();
            return;
          }
          try {
            fetch('./docs/index.html', { method: 'HEAD', cache: 'no-store' })
              .then(function (res) {
                if (res && res.ok) {
                  window.location.replace('./docs/' + (window.location.search || '') + (window.location.hash || ''));
                } else {
                  onUnavailable();
                }
              })
              .catch(onUnavailable);
          } catch (e) {
            onUnavailable();
          }
        };

        window.__playtelasHandleEntryError = function () {
          tryRedirectToDocs(function () {
            showBootstrapError('Erro ao carregar o módulo principal do aplicativo.');
          });
        };

        var showBootstrapError = function (msg) {
          var root = document.getElementById('root');
          if (!root) return;
          var fb = document.getElementById('splash-fallback');
          var title = document.getElementById('splash-fallback-title');
          var detail = document.getElementById('splash-fallback-detail');
          if (fb && title && detail) {
            title.textContent = 'Falha ao carregar o aplicativo';
            detail.textContent = msg || 'Erro ao inicializar os scripts da página.';
            fb.style.display = 'block';
          } else {
            root.innerHTML =
              '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#090d16;color:#f1f5f9;font-family:system-ui,sans-serif;padding:24px;text-align:center;">' +
              '<div style="max-width:420px;width:100%;background:#0f172a;border:1px solid #1e293b;border-radius:20px;padding:24px;">' +
              '<h2 style="margin:0 0 8px 0;font-size:1.15rem;color:#fff;">Falha ao carregar o PlayTelas</h2>' +
              '<p style="margin:0 0 16px 0;font-size:0.8rem;color:#94a3b8;">' + String(msg || 'Erro inesperado na inicialização.') + '</p>' +
              '<button onclick="window.__playtelasResetCache()" style="background:#4f46e5;color:#fff;border:none;padding:10px 16px;border-radius:10px;font-weight:600;cursor:pointer;">Limpar Cache e Recarregar</button>' +
              '</div></div>';
          }
        };

        window.addEventListener('error', function (event) {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.querySelector('#splash-status') || root.innerHTML.trim() === '')) {
            tryRedirectToDocs(function () {
              showBootstrapError(event && event.message ? event.message : 'Erro ao carregar recurso da página.');
            });
          }
        });

        window.addEventListener('unhandledrejection', function (event) {
          var root = document.getElementById('root');
          if (root && (!root.firstElementChild || root.querySelector('#splash-status') || root.innerHTML.trim() === '')) {
            var reason = event && event.reason ? (event.reason.message || String(event.reason)) : 'Erro assíncrono na inicialização.';
            showBootstrapError(reason);
          }
        });

        setTimeout(function () {
          var root = document.getElementById('root');
          if (root && root.querySelector('#splash-status') && isUncompiledSource()) {
            tryRedirectToDocs(function () {});
          }
        }, 1200);

        setTimeout(function () {
          var fb = document.getElementById('splash-fallback');
          var root = document.getElementById('root');
          if (fb && root && root.querySelector('#splash-status')) {
            fb.style.display = 'block';
          }
        }, 5000);
      })();
    </script>
    <script type="module" src="./src/main.tsx" onerror="window.__playtelasHandleEntryError && window.__playtelasHandleEntryError()"></script>
  </body>
</html>
