<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <linearGradient id="antennaGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)" />
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="4" />

  <!-- Antennas -->
  <line x1="200" y1="140" x2="140" y2="70" stroke="url(#antennaGrad)" stroke-width="12" stroke-linecap="round" />
  <circle cx="140" cy="70" r="12" fill="#38bdf8" filter="url(#glow)" />
  
  <line x1="312" y1="140" x2="372" y2="70" stroke="url(#antennaGrad)" stroke-width="12" stroke-linecap="round" />
  <circle cx="372" cy="70" r="12" fill="#ec4899" filter="url(#glow)" />

  <!-- TV Case -->
  <rect x="56" y="130" width="400" height="290" rx="42" fill="#1e293b" stroke="#334155" stroke-width="6" />
  
  <!-- TV Screen Inner Glow -->
  <rect x="78" y="152" width="356" height="246" rx="26" fill="#090d16" />
  
  <!-- Live Screen Graphic with gradient -->
  <rect x="84" y="158" width="344" height="234" rx="22" fill="url(#screenGrad)" opacity="0.9" />

  <!-- Play Symbol -->
  <polygon points="230,225 315,275 230,325" fill="#ffffff" filter="url(#glow)" />
  
  <!-- Live Signal Ripple Indicator -->
  <circle cx="120" cy="195" r="8" fill="#ef4444" />
  <circle cx="120" cy="195" r="14" fill="none" stroke="#ef4444" stroke-width="3" opacity="0.75" />
  <text x="142" y="200" fill="#ffffff" font-family="system-ui, sans-serif" font-weight="900" font-size="14" letter-spacing="1">AO VIVO</text>

  <!-- TV Stand -->
  <path d="M 190 420 L 160 460 M 322 420 L 352 460" stroke="#475569" stroke-width="12" stroke-linecap="round" />
</svg>
