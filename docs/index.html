  <body class="bg-[#090d16] text-slate-100 antialiased overflow-x-hidden selection:bg-indigo-500 selection:text-white">
    <noscript>
      <div style="min-height: 100vh; display: flex; align-items: center; justify-content: center; background: #090d16; color: #fff; font-family: sans-serif; text-align: center; padding: 20px;">
        <div>
          <h2>JavaScript Necessário</h2>
          <p style="color: #94a3b8;">Por favor, habilite o JavaScript em seu navegador para utilizar o CineLive TV.</p>
        </div>
      </div>
    </noscript>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #090d16; color: #fff; font-family: 'Plus Jakarta Sans', sans-serif; padding: 24px; text-align: center;">
        <div style="width: 52px; height: 52px; border-radius: 16px; background: linear-gradient(135deg, #6366f1, #ec4899); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4); margin-bottom: 16px;">
          <svg style="width: 28px; height: 28px; fill: none; stroke: white; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;" viewBox="0 0 24 24"><rect width="20" height="15" x="2" y="7" rx="2" ry="2"></rect><polyline points="17 2 12 7 7 2"></polyline></svg>
        </div>
        <div style="font-weight: 800; font-size: 1.25rem; letter-spacing: -0.025em; color: #f8fafc; margin-bottom: 6px;">CineLive TV</div>
        <div id="splash-status" style="font-size: 0.85rem; color: #94a3b8; max-width: 380px;">Iniciando transmissão e catálogo de canais...</div>
        <div id="splash-fallback" style="display: none; margin-top: 20px; max-width: 420px; background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(51, 65, 85, 0.8); padding: 16px; border-radius: 16px; font-size: 0.8rem; color: #cbd5e1; line-height: 1.5;">
          <p style="margin-bottom: 12px; font-weight: 600; color: #facc15;">⚠️ O aplicativo está demorando para iniciar</p>
          <p style="margin-bottom: 12px; font-size: 0.75rem; color: #94a3b8;">
            No GitHub Pages, certifique-se de publicar os arquivos da pasta <strong>dist</strong> (gerados por <code>npm run build</code>) ou selecionar em <strong>Settings &gt; Pages &gt; Source: GitHub Actions</strong>.
          </p>
          <button onclick="window.location.reload()" style="background: #4f46e5; color: white; border: none; padding: 8px 16px; border-radius: 10px; font-weight: 600; font-size: 0.8rem; cursor: pointer;">
            Tentar Novamente
          </button>
        </div>
      </div>
      <script>
        setTimeout(function() {
          var fb = document.getElementById('splash-fallback');
          var root = document.getElementById('root');
          // If root has not been replaced by React
          if (fb && root && root.querySelector('#splash-status')) {
            fb.style.display = 'block';
          }
        }, 5000);
      </script>
    </div>
  </body>
